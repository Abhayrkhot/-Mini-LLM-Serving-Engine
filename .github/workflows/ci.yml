name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e '.[dev]'
      # Parity tests build tiny random Hugging Face models locally; no downloads.
      - run: pytest -q --durations=10

  load-test:
    # The whole HTTP stack under concurrent streaming load, over the fake executor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e '.[dev]'
      - name: Serve and load
        run: |
          python benchmarks/fake_server.py --port 8001 &
          for i in $(seq 50); do curl -sf localhost:8001/health && break; sleep 0.2; done
          python benchmarks/bench_serving.py --base-url http://localhost:8001 --vocab-size 259 \
            --num-prompts 200 --request-rate 20 --input-len 256 --output-len 64 \
            --range-ratio 0.5 --output load.json
          python -c "import json,sys; r=json.load(open('load.json')); sys.exit(r['failed'] != 0)"
          curl -sf localhost:8001/metrics | grep minillm_time_to_first_token_seconds_count
