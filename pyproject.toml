[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minillm"
version = "0.1.0"
description = "A small LLM serving engine: paged KV cache, continuous batching, chunked prefill, prefix caching, OpenAI-compatible API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "transformers>=4.45",  # tokenizers and chat templates; also the reference model in tests
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus_client>=0.20",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Paged attention kernels for CUDA. FlashInfer is the tested backend (H200, torch 2.14);
# flash-attn's prebuilt wheels only cover torch <= 2.9.
cuda = ["flashinfer-python>=0.2"]
flash-attn = ["flash-attn>=2.6"]
bench = ["httpx>=0.27", "numpy>=1.26"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "numpy>=1.26",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
minillm-serve = "minillm.entrypoints.openai_server:main"

[tool.setuptools.packages.find]
include = ["minillm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: needs downloaded model weights",
    "gpu: needs a CUDA device",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
packages = ["minillm"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
